[project]
name = "keiba-predictor"
version = "0.1.0"
description = "競馬（単勝）の予測・期待値・バックテスト"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "lightgbm>=4.0"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools]
packages = ["keiba_predictor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
